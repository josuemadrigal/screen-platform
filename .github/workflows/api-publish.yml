name: Build and Push API

on:
  push:
    branches: [ "main" ]
    paths:
      - "screen-api/**"
      - ".github/workflows/api-publish.yml"
  workflow_dispatch:

jobs:
  # Gate: nothing is published unless the project compiles. A red build leaves
  # the previously published :latest image untouched in production.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screen-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: screen-api/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (TypeScript compile check)
        run: npm run build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./screen-api
          push: true
          # :latest is what the server pulls. The sha tag is an immutable
          # rollback target: set IMAGE_TAG=sha-<commit> in the server .env.
          tags: |
            josueahp/screen-api:latest
            josueahp/screen-api:sha-${{ github.sha }}

name: Build and Push Web

on:
  push:
    branches: [ "main" ]
    paths:
      - "screenManager/**"
      - "screen-tv-client/**"
      - "deploy/Dockerfile.web"
      - "deploy/Caddyfile"
      - ".github/workflows/web-publish.yml"
  workflow_dispatch:

jobs:
  # Gate: both frontends must compile before anything is published.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Panel - install and build
        working-directory: screenManager
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: TV client - install and build
        working-directory: screen-tv-client
        run: |
          npm ci
          npm run build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web (Caddy + panel + TV client)
        uses: docker/build-push-action@v5
        with:
          # Repository root: the Dockerfile copies both frontends and deploy/Caddyfile.
          context: .
          file: deploy/Dockerfile.web
          push: true
          # The API URL is resolved at runtime from DOMAIN (see deploy/Caddyfile),
          # so this image is domain-independent.
          tags: |
            josueahp/screen-web:latest
            josueahp/screen-web:sha-${{ github.sha }}
          # Stamped into the TV client and published at /updates/latest.json so installed
          # Android apps pick this build up as a live update.
          build-args: |
            BUNDLE_VERSION=${{ github.sha }}

# Alternative to Caddy when the server already runs Nginx.
# Assumes the API container is published on 127.0.0.1:4006 and the static builds
# live in /var/www/screen-platform/{panel,tv}. Certificates from certbot:
#   sudo certbot --nginx -d panel.example.com -d tv.example.com -d api.example.com
# certbot rewrites the `listen 443 ssl` and `ssl_certificate*` lines below.

# ---------- Admin panel ----------
server {
    listen 80;
    server_name panel.example.com;
    root /var/www/screen-platform/panel;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ---------- TV client ----------
server {
    listen 80;
    server_name tv.example.com;
    root /var/www/screen-platform/tv;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# ---------- API + Socket.IO + media ----------
server {
    listen 80;
    server_name api.example.com;

    # Video uploads from the panel
    client_max_body_size 1G;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Socket.IO needs the WebSocket upgrade headers
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

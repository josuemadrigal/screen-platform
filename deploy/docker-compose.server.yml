# Server-side stack: pulls the images that GitHub Actions publishes to Docker Hub
# on every push to main (.github/workflows/*-publish.yml).
# No source code, Node or build tools needed on the server.
#
# On the server, in a folder with this file and a .env (see .env.example):
#   docker compose pull && docker compose up -d
# After that, Watchtower pulls new :latest images from Docker Hub by itself (every 5 minutes)
# and recreates the api/web containers, so a push to main reaches the server with no manual step.
#
# Only ports 80 and 443 are published. The API and the database stay on the internal network.

name: screen-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-screen_db}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-screen_user} -d ${POSTGRES_DB:-screen_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${IMAGE_API:-josueahp/screen-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      NODE_ENV: production
      PORT: 4006
      DATABASE_URL: postgresql://${POSTGRES_USER:-screen_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-screen_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      # Browser origins allowed for HTTP and Socket.IO: the two frontends served by Caddy, plus the
      # Capacitor app (its WebView runs the TV client from https://localhost on Android, capacitor://localhost on iOS).
      CORS_ORIGIN: https://${PANEL_HOST:-${DOMAIN}}${PUBLIC_URL_SUFFIX:-},https://${TV_HOST:-tv.${DOMAIN}}${PUBLIC_URL_SUFFIX:-},https://localhost,capacitor://localhost
      # Max height of re-encoded videos (1080 default). Set 720 if a TV's decoder rejects 1080p.
      TV_MAX_HEIGHT: ${TV_MAX_HEIGHT:-1080}
      TZ: ${TZ:-America/Santo_Domingo}
      BOT_URL: ${BOT_URL:-}
      BOT_IMG_screen: ${BOT_IMG_screen:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
    volumes:
      # Uploaded videos and thumbnails. Back this folder up together with the database.
      - ${STORAGE_PATH:-./storage}:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${IMAGE_WEB:-josueahp/screen-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      # Hostnames of the three sites. Default: panel on DOMAIN, tv.DOMAIN, api.DOMAIN.
      PANEL_HOST: ${PANEL_HOST:-${DOMAIN}}
      TV_HOST: ${TV_HOST:-tv.${DOMAIN}}
      API_HOST: ${API_HOST:-api.${DOMAIN}}
      # Port the public sites listen on. 443 normally; another one (e.g. 8443) when 443 of the
      # public IP is taken and the router translates PUBLIC_PORT -> this server.
      PUBLIC_PORT: ${PUBLIC_PORT:-443}
      PUBLIC_URL_SUFFIX: ${PUBLIC_URL_SUFFIX:-}
      # Certificate validation: http (needs ports 80/443 reachable) or namecheap/cloudflare/duckdns (DNS).
      TLS_MODE: ${TLS_MODE:-http}
      PUBLIC_IP: ${PUBLIC_IP:-}
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER:-}
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      # TLS_MODE=duckdns-delegated: DuckDNS name that _acme-challenge.DOMAIN points to (CNAME)
      ACME_OVERRIDE_DOMAIN: ${ACME_OVERRIDE_DOMAIN:-}
    ports:
      - '80:80'
      - '${PUBLIC_PORT:-443}:${PUBLIC_PORT:-443}'
      - '${PUBLIC_PORT:-443}:${PUBLIC_PORT:-443}/udp'
    volumes:
      # Certificates and Caddy state; keep them so certificates are not re-issued on every restart.
      - caddy_data:/data
      - caddy_config:/config
      # APK published with `npm run apk:publish` (screen-tv-client); served at /apk/screentv.apk
      - ./apk:/srv/apk:ro
    depends_on:
      - api

  # Keeps the DuckDNS name pointing at the current public IP (the router has WAN failover).
  # Only started with COMPOSE_PROFILES=duckdns in .env.
  ddns:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    profiles: ["duckdns"]
    environment:
      # DuckDNS name to keep updated. Defaults to DOMAIN; set DUCKDNS_DOMAIN when DOMAIN is the
      # customer's domain and DuckDNS is only used for certificate validation (duckdns-delegated).
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:-${DOMAIN}}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      # Optional: follow another DDNS name (e.g. the router's MikroTik cloud name) instead of
      # this server's egress IP. Keeps DuckDNS on the inbound WAN when the router has failover.
      DDNS_FOLLOW_HOST: ${DDNS_FOLLOW_HOST:-}
    command: >
      sh -c 'while true; do
        ip="";
        if [ -n "$${DDNS_FOLLOW_HOST}" ]; then
          ip=$$(nslookup "$${DDNS_FOLLOW_HOST}" 2>/dev/null | awk "/^Address/ && !/#53/ {print \$$2}" | grep -E "^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$$" | tail -1);
        fi;
        r=$$(curl -s "https://www.duckdns.org/update?domains=$${DUCKDNS_DOMAIN%%.duckdns.org}&token=$${DUCKDNS_TOKEN}&ip=$${ip}");
        echo "$$(date -u +%FT%TZ) duckdns update ip=$${ip:-auto}: $$r"; sleep 300; done'

  # Auto-deploy: checks Docker Hub every 5 minutes and recreates api/web when their :latest
  # image changed. Only containers with the watchtower.enable label are touched (never postgres).
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      # Docker Engine 25+ rejects the old API version Watchtower negotiates by default.
      DOCKER_API_VERSION: "1.44"
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
